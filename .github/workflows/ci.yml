name: PulseScope CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Headless matplotlib backend — prevents "cannot connect to X server" on CI runners
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Static Analysis (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check . --select E,W,F,I --ignore E501

  test-and-verify:
    name: Unit Tests & Data Engine Verification
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          retention-days: 14

      - name: Execute Full Analytics & Simulation Pipeline
        run: |
          python analytics_engine.py

      - name: Verify Dashboard Visuals Generator
        run: |
          python generate_dashboard_previews.py

      - name: Compile 1-Page Executive PDF Brief
        run: |
          python create_executive_pdf.py

      - name: Upload Pipeline Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            data/
            docs/images/
            PulseScope_Executive_Brief.pdf
          retention-days: 7
