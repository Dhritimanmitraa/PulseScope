name: PulseScope CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Unit Tests & Data Engine Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Execute Full Analytics & Simulation Pipeline
        run: |
          python analytics_engine.py

      - name: Verify Dashboard Visuals Generator
        run: |
          python generate_dashboard_previews.py

      - name: Compile 1-Page Executive PDF Brief
        run: |
          python create_executive_pdf.py
